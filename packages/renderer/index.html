<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <!-- Every tournament platform needs its API host listed in connect-src; this is
       static HTML, so the platform registry cannot add entries here itself. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src ws: wss: https://api.start.gg/gql/alpha https://grpcweb.parry.gg; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sb-stream-tool</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
